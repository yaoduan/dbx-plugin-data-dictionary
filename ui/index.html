<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据字典导出</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1 id="title">数据字典导出</h1>
        <p class="hint" id="subtitle">把所选数据库的表结构导出为 DOCX 或 Excel 文档。</p>
      </header>

      <section class="dbx-card" id="unsupported" hidden>
        <p class="notice notice-error" id="unsupported-text"></p>
      </section>

      <section class="dbx-card" id="setup">
        <div class="grid">
          <label class="field">
            <span class="dbx-label" id="label-connection">连接</span>
            <select class="dbx-select" id="connection"></select>
          </label>

          <label class="field" id="database-field">
            <span class="dbx-label" id="label-database">数据库</span>
            <div class="inline">
              <input class="dbx-input" id="database" list="database-options" autocomplete="off" spellcheck="false" />
              <datalist id="database-options"></datalist>
              <button class="dbx-btn dbx-btn--ghost" id="reload-database" type="button">刷新</button>
            </div>
          </label>

          <label class="field" id="schema-field">
            <span class="dbx-label" id="label-schema">Schema</span>
            <div class="inline">
              <input class="dbx-input" id="schema" list="schema-options" autocomplete="off" spellcheck="false" />
              <datalist id="schema-options"></datalist>
              <button class="dbx-btn dbx-btn--ghost" id="reload-schema" type="button">刷新</button>
            </div>
          </label>

          <label class="field">
            <span class="dbx-label" id="label-format">导出格式</span>
            <select class="dbx-select" id="format">
              <option value="docx">Word 文档（.docx）</option>
              <option value="xlsx">Excel 工作簿（.xlsx）</option>
            </select>
          </label>

          <label class="field" id="layout-field">
            <span class="dbx-label" id="label-layout">Excel 布局</span>
            <select class="dbx-select" id="layout">
              <option value="single-sheet">汇总表（字段明细 + 索引 + 外键）</option>
              <option value="sheet-per-table">每张表一个工作表</option>
            </select>
          </label>
        </div>

        <div class="options">
          <label class="check"><input type="checkbox" id="opt-indexes" checked /><span id="label-indexes">包含索引</span></label>
          <label class="check"><input type="checkbox" id="opt-foreign-keys" checked /><span id="label-foreign-keys">包含外键</span></label>
        </div>

        <div class="actions">
          <button class="dbx-btn dbx-btn--primary" id="load-tables" type="button">读取表清单</button>
          <button class="dbx-btn dbx-btn--primary" id="export" type="button" disabled>导出文档</button>
          <span class="status" id="status"></span>
        </div>

        <p class="notice notice-error" id="error" hidden></p>
        <p class="notice notice-warn" id="warnings" hidden></p>
      </section>

      <section class="dbx-card" id="tables-card" hidden>
        <div class="tables-header">
          <h2 class="dbx-section-title" id="label-tables">表选择</h2>
          <div class="tables-tools">
            <input class="dbx-input" id="filter" placeholder="搜索表名或注释" autocomplete="off" />
            <button class="dbx-btn dbx-btn--ghost" id="select-all" type="button">全选</button>
            <button class="dbx-btn dbx-btn--ghost" id="select-none" type="button">清空</button>
          </div>
        </div>
        <p class="hint" id="selection-count"></p>
        <div class="table-list" id="table-list"></div>
      </section>
    </main>

    <script src="lib/zip.js"></script>
    <script src="lib/dialects.js"></script>
    <script src="lib/collect.js"></script>
    <script src="lib/xlsx.js"></script>
    <script src="lib/docx.js"></script>
    <script src="lib/report.js"></script>
    <script src="main.js"></script>
  </body>
</html>
